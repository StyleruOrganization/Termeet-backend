name: local-backend

networks:
  backend-net:

volumes:
  postgres_data:
  rabbitmq-data:
  grafana_data:
  prometheus_data:
  minio_data:


services:  

  backend:
    build: .
    container_name: backend-local
    ports:
      - 8000:8000
      - 50051:50051
    command: |
      sh -c "alembic -c backend/alembic.ini upgrade head && \
      uvicorn backend.src.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/migrations/:/code/backend/migrations/
      - ./backend/docs/openapi.yaml:/code/backend/docs/openapi.yaml
      - ./certs/:/code/backend/certs/
      - ./feedback_images/:/code/feedback_images/
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: backend
          target: /code/backend
          ignore:
          - migrations/
          - docs/openapi.yaml
        - action: rebuild
          path: .env
          target: /code/.env

  postgres:
    image: postgres:17-alpine
    container_name: postgres-backend-local
    env_file:
      - .env
    ports:
     - 5432:5432
    volumes:
     - postgres_data:/var/lib/postgresql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq-local
    container_name: rabbitmq-local
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maildev:
    image: maildev/maildev
    container_name: maildev-local
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - backend-net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  minio:
    image: minio/minio
    container_name: minio-local
    entrypoint: sh
    command: > 
      -c 'mkdir -p /data/test-bucket
      && minio server /data'
    volumes:
      - minio_data:/data
    env_file:
      - .env
    ports: 
      - 9000:9000
      - 9001:9001
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus-local
    ports:
      - 9090:9090
    networks:
      - backend-net
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana-local
    ports:
      - 3000:3000
    networks:
      - backend-net
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_data/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana_data/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana_data/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter-local
    ports:
      - 9100:9100
    networks:
      - backend-net
