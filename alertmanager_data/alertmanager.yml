global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 0s
  group_interval: 5s
  repeat_interval: 1h
  receiver: 'backend-webhook'

receivers:
  - name: 'backend-webhook'
    webhook_configs:
      - url: 'http://backend:8000/api/telemetry/alerts/webhook'
        send_resolved: true
