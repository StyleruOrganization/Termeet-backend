name: Deploy Prod Backend
run-name: "Deploy Prod Backend"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_infra:
        description: "Обновить postgres, rabbit, grafana и остальные (не только API)"
        type: boolean
        default: false

    
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check .env-example changes
        if: github.event_name == 'push' && github.run_attempt == 1
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "\.env-example"; then
            echo "❌ .env-example изменился!"
            echo ""
            echo "Обнови .env на сервере, затем нажми 'Re-run failed jobs' или 'Re-run all jobs'."
            exit 1
          fi

      - name: Login to Yandex Container Registry
        run: |
          echo ${{ secrets.Y_TOKEN }} | docker login \
            --username oauth \
            --password-stdin cr.yandex

      - name: Build and push Docker images
        run: |
          REGISTRY=cr.yandex/${{ secrets.CONTAINER_REGISTRY }}

          docker build -f Dockerfile.prod -t $REGISTRY/backend-prod .
          docker build -f Dockerfile.grafana -t $REGISTRY/grafana .
          docker build -f Dockerfile.prometheus -t $REGISTRY/prometheus .
          docker build -f Dockerfile.alertmanager -t $REGISTRY/alertmanager .

          docker push $REGISTRY/backend-prod
          docker push $REGISTRY/grafana
          docker push $REGISTRY/prometheus
          docker push $REGISTRY/alertmanager

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-prod.yml"
          target: "backend-prod"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY: cr.yandex/${{ secrets.CONTAINER_REGISTRY }}
          DOMAIN: backend.termeet.tech
          EMAIL: ${{ secrets.HTTPS_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,DOMAIN,EMAIL
          script: |
            echo "🚀 Деплой backend-а"
            cd backend-prod

            echo ${{ secrets.Y_TOKEN }} | docker login \
              --username oauth \
              --password-stdin cr.yandex

            if [ "${{ github.event.inputs.update_infra }}" = "true" ]; then
              echo "Обновляю все сервисы compose"
              docker compose -f docker-compose-prod.yml up -d --pull always
            else
              echo "Обновляю только backend-prod"
              docker compose -f docker-compose-prod.yml up -d --pull always --no-deps backend
            fi
