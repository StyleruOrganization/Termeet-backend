name: Deploy Prod Backend
run-name: "Deploy Prod Backend"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_infra:
        description: "Обновить postgres, rabbit, grafana и остальные (не только API)"
        type: boolean
        default: false

    
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check .env-example changes
        if: github.event_name == 'push' && github.run_attempt == 1
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "\.env-example"; then
            echo "❌ .env-example изменился!"
            echo ""
            echo "Обнови .env на сервере, затем нажми 'Re-run failed jobs' или 'Re-run all jobs'."
            exit 1
          fi

      - name: Login to Yandex Container Registry
        run: |
          echo ${{ secrets.Y_TOKEN }} | docker login \
            --username oauth \
            --password-stdin cr.yandex

      - name: Build and push Docker image

        run: |
          docker build -f Dockerfile.prod \
            -t cr.yandex/${{ secrets.CONTAINER_REGISTRY }}/backend-prod .

          docker push cr.yandex/${{ secrets.CONTAINER_REGISTRY }}/backend-prod

      - name: Remove stub dirs Docker created instead of config files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p backend-prod/grafana_data backend-prod/prometheus_data
            cd backend-prod
            for f in grafana_data/dashboards.yml grafana_data/datasources.yml prometheus_data/prometheus.yml; do
              if [ -d "$f" ]; then
                echo "Removing stub directory $f"
                docker stop grafana-prod 2>/dev/null || true
                rm -rf "$f"
              fi
            done

      - name: Copy compose and monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-prod.yml,grafana_data,prometheus_data"
          target: "backend-prod"
          overwrite: true

      - name: Deploy to server

        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY: cr.yandex/${{ secrets.CONTAINER_REGISTRY }}
          DOMAIN: backend.termeet.tech
          EMAIL: ${{ secrets.HTTPS_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,DOMAIN,EMAIL
          script: |
            echo "🚀 Деплой backend-а"
            cd backend-prod

            echo ${{ secrets.Y_TOKEN }} | docker login \
              --username oauth \
              --password-stdin cr.yandex

            if [ "${{ github.event.inputs.update_infra }}" = "true" ]; then
              echo "Обновляю все сервисы compose"
              docker compose -f docker-compose-prod.yml up -d --pull always
            else
              echo "Обновляю только backend-prod"
              docker compose -f docker-compose-prod.yml up -d --pull always --no-deps backend
            fi
