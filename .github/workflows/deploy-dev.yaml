name: Deploy Dev Backend
run-name: "Deploy Dev Backend"

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      update_infra:
        description: "Обновить postgres, rabbit, grafana и остальные (не только API)"
        type: boolean
        default: false

# Чиню флоу

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check .env-example changes
        if: github.event_name == 'push' && github.run_attempt == 1
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "\.env-example"; then
            echo "❌ .env-example изменился!"
            echo ""
            echo "Обнови .env на сервере, затем нажми 'Re-run failed jobs' или 'Re-run all jobs'."
            exit 1
          fi

      - name: Login to Yandex Container Registry
        run: |
          echo ${{ secrets.Y_TOKEN }} | docker login \
            --username oauth \
            --password-stdin cr.yandex

      - name: Build and push Docker image

        run: |
          docker build -f Dockerfile.dev \
            -t cr.yandex/${{ secrets.CONTAINER_REGISTRY }}/backend-dev .

          docker push cr.yandex/${{ secrets.CONTAINER_REGISTRY }}/backend-dev

      - name: Remove stub dirs Docker created instead of config files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p backend-dev
            cd backend-dev
            docker stop grafana-dev prometheus-dev 2>/dev/null || true
            # Bind-mounts Docker создаёт от root; rm от CI-юзера не проходит.
            docker run --rm -v "$(pwd):/work" alpine sh -c \
              'rm -rf /work/grafana_data /work/prometheus_data'

      - name: Copy compose and monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-dev.yml,grafana_data,prometheus_data"
          target: "backend-dev"
          overwrite: true

      - name: Deploy to server

        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY: cr.yandex/${{ secrets.CONTAINER_REGISTRY }}
          DOMAIN: backend.termeet-dev.ru
          EMAIL: ${{ secrets.HTTPS_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,DOMAIN,EMAIL
          script: |
            echo "🚀 Деплой backend-а"
            cd backend-dev

            echo ${{ secrets.Y_TOKEN }} | docker login \
              --username oauth \
              --password-stdin cr.yandex

            # Обычный push обновляет только API. Postgres/Rabbit/Grafana
            # не пересоздаём — из-за этого деплой падал на конфликте имён.
            if [ "${{ github.event.inputs.update_infra }}" = "true" ]; then
              echo "Обновляю все сервисы compose"
              docker compose -f docker-compose-dev.yml up -d --pull always
            else
              echo "Обновляю только backend-dev"
              docker compose -f docker-compose-dev.yml up -d --pull always --no-deps backend
              docker compose -f docker-compose-dev.yml up -d grafana prometheus
            fi
